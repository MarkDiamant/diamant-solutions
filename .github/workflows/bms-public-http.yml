name: BMS Public HTTP Acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Verify production fictional catalogue and anonymous write rejection
        run: node --test tests/flooring-http-smoke.mjs
        env:
          BMS_TEST_BASE_URL: https://bms.diamantsolutions.co.uk
