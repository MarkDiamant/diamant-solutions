name: BMS fictional launch smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tests/bms-launch-smoke.spec.ts'
      - '.github/workflows/bms-launch-smoke.yml'
permissions:
  contents: read
jobs:
  fictional-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/bms-launch-smoke.spec.ts --project=chromium --workers=1 --reporter=line
        env:
          CI: 'true'
