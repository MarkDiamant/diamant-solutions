name: BMS Unit Regression Tests
on:
  push:
    branches: [main]
    paths:
      - "business-software-core/lib/worker-time.ts"
      - "business-software-core/lib/safe-csv.ts"
      - "business-software-core/components/admin/LabourCosting.tsx"
      - "business-software-core/components/admin/WorkerPortal.tsx"
      - "tests/worker-time.test.mjs"
      - "tests/safe-csv.test.mjs"
      - "tests/ruby-confirmation.test.mjs"
      - "app/api/bms-live/[...path]/route.ts"
      - "business-software-core/components/admin/BmsUI.tsx"
      - "tests/bms-shared-primitives.test.mjs"
      - "tests/bms-api-static-guards.test.mjs"
      - "app/api/bms-demo/flooring-actions/route.ts"
      - "app/api/bms-materials/route.ts"
      - "app/api/business-software/tenants/**/gmail/**"
      - "lib/business-software/gmail-send.js"
      - "app/bms-runtime/ai/page.tsx"
      - ".github/workflows/bms-unit-regressions.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  worker-time:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: npm install --ignore-scripts
      - name: Worker daily-hours and UK DST regression
        run: node --test tests/worker-time.test.mjs tests/safe-csv.test.mjs tests/ruby-confirmation.test.mjs tests/bms-shared-primitives.test.mjs tests/bms-api-static-guards.test.mjs
        env:
          TZ: Europe/London
