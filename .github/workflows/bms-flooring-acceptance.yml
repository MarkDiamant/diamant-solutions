name: BMS Flooring Acceptance
on:
  workflow_dispatch:
    inputs:
      run_mutations:
        description: "Explicitly allow isolated fictional-demo write and reset tests"
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: bms-flooring-acceptance
  cancel-in-progress: false
jobs:
  acceptance:
    runs-on: ubuntu-latest
    environment: bms-acceptance
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: npm install --ignore-scripts
      - run: npm install --no-save --ignore-scripts @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Require protected demo-manager test identity
        env:
          BMS_TEST_ACCESS_TOKEN: ${{ secrets.BMS_TEST_ACCESS_TOKEN }}
          BMS_TEST_EMAIL: ${{ secrets.BMS_TEST_EMAIL }}
          BMS_TEST_PASSWORD: ${{ secrets.BMS_TEST_PASSWORD }}
          BMS_TEST_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.BMS_TEST_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -n "$BMS_TEST_ACCESS_TOKEN" ]; then exit 0; fi
          if [ -n "$BMS_TEST_EMAIL" ] && [ -n "$BMS_TEST_PASSWORD" ] && [ -n "$BMS_TEST_SUPABASE_PUBLISHABLE_KEY" ]; then exit 0; fi
          echo "::error::Dedicated demo-manager credentials are required; browser acceptance cannot be marked passed."
          exit 1
      - name: Read-only smoke and opt-in manager acceptance
        run: npx playwright test
        env:
          BMS_TEST_BASE_URL: https://bms.diamantsolutions.co.uk
          BMS_TEST_ACCESS_TOKEN: ${{ secrets.BMS_TEST_ACCESS_TOKEN }}
          BMS_TEST_EMAIL: ${{ secrets.BMS_TEST_EMAIL }}
          BMS_TEST_PASSWORD: ${{ secrets.BMS_TEST_PASSWORD }}
          BMS_TEST_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.BMS_TEST_SUPABASE_PUBLISHABLE_KEY }}
          BMS_RUN_MUTATIONS: ${{ inputs.run_mutations && '1' || '0' }}
