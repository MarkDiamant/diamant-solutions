name: Embedded BMS browser regression
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  embedded-navigation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Wait for deployed build
        run: |
          for i in $(seq 1 40); do
            if curl -fsSL --max-time 15 https://diamantsolutions.co.uk/software >/dev/null; then break; fi
            sleep 10
          done
          sleep 45
      - name: Test actual embedded sidebar and business switching
        env:
          BMS_E2E_BASE_URL: https://diamantsolutions.co.uk
        run: npx playwright test tests/embedded-bms-navigation.spec.cjs --project=chromium
