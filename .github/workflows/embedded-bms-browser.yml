name: Embedded BMS local browser regression
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  embedded-navigation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BMS_RUN_ID: local-${{ github.run_id }}-${{ github.run_attempt }}
      BMS_RUN_LEDGER: local-bms-release-ledger.json
      BMS_E2E_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build candidate with exact-origin guard on Next build
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));if(!p.scripts.build.endsWith('next build'))throw Error('Unexpected build script');p.scripts.build=p.scripts.build.replace(/next build$/, 'node --require ./scripts/bms-local-network-deny.cjs node_modules/next/dist/bin/next build');fs.writeFileSync('package.json',JSON.stringify(p,null,2))"
          npm run build
      - run: npx playwright install --with-deps chromium
      - name: Run original embedded desktop and mobile bodies locally
        run: |
          node -e "require('./tests/bms-release-ledger.cjs').init(process.env.BMS_RUN_LEDGER,process.env.BMS_RUN_ID)"
          NODE_OPTIONS="--require=$PWD/scripts/bms-local-network-deny.cjs" npm start > local-next.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          node scripts/bms-local-ready.cjs
          npx playwright test tests/embedded-bms-navigation.spec.cjs --project=chromium --config=playwright.release.config.cjs
      - name: Hosted acceptance remains a mandatory held controller stage
        run: echo 'Local CI is not release acceptance. Hosted original embedded tests plus final fictional labour entry and charity acceptance require one nonreusable provider-identity-gated controller record. See docs/bms-controller-release.md.'
      - name: Preserve local results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: local-embedded-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            local-bms-release-ledger.json
            local-next.log
            test-results/
