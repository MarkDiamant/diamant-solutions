name: Validate universal canonical BMS release (no production promotion)
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  validate-canonical-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validate canonical deployment domains and active tenant routing
        env:
          VERCEL_TOKEN: ${{ secrets.BMS_VERCEL_AUDIT_TOKEN }}
          VERCEL_TEAM_ID: team_pnXM49OpKfjmDidelNwJzcZ6
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || { echo '::error::Missing BMS_VERCEL_AUDIT_TOKEN'; exit 1; }
          node scripts/bms-vercel-deployment-inventory.cjs > "$RUNNER_TEMP/bms-inventory.json"
          node -e 'const x=require(process.argv[1]);if(x.deployments.length!==1||!x.domains.includes("mjmetal.diamantsolutions.co.uk"))process.exit(1)' "$RUNNER_TEMP/bms-inventory.json"
      - name: Validate shared workflow regression and rollback gates
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run test:bms-release-parity
          node --test tests/bms-inline-job-creation.test.cjs
      - name: Require separate authenticated Preview acceptance before approval
        run: |
          echo 'Validation only. No per-tenant code copies, no legacy M&J repository updates, no production deployment.'
          echo 'Approval requires authenticated Preview browser acceptance, tenant-scoped concurrency and rollback rehearsal.'
